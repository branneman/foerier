name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier 0 — the cheapest tier, and a different class of issue than any
  # behavioural test covers. Full-repo, never staged-files: these are the exact
  # three commands the pre-commit hook runs (docs/testing.md).
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  # Tiers 1, 2 and 3 — unit, convergence/merge, and component. No I/O, no
  # database, no network.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  # Tier 2s — the real Hono app against a real Postgres, over HTTP.
  server-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: foerier
          POSTGRES_PASSWORD: foerier
          POSTGRES_DB: foerier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://foerier:foerier@localhost:5432/foerier_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:server

  # Tier 5 against the local stack (docs/testing.md). The complement of
  # `e2e-prod` below, and the reason it exists: that job always targets the box,
  # so `grep: /@production/` excludes `auth.spec.ts`, `deviceLink.spec.ts` and
  # `invite.spec.ts` — each for a good reason (a Maintainer script needing
  # DATABASE_URL, a spec that proves joining, a spec that signs the run's own
  # Device out). Three of five spec files therefore ran on a developer's machine
  # or never, which is how `invite.spec.ts` came to click a back link Desktop
  # had already stopped drawing: wrong for as long as nobody ran it, and no tier
  # said so.
  #
  # The fix is the local stack, not a change to the grep. Playwright's own
  # `webServer` block brings up the API (`node src/index.ts`, which migrates on
  # boot, so no migrate step here) and a production `vite preview` build; all
  # this job owes it is a Postgres and the URL to reach it.
  #
  # It runs on pull requests as well as pushes — unlike `contract` and
  # `e2e-prod`, which need a deployed SHA — because the whole point is that
  # these specs run *before* a merge rather than after one.
  #
  # It holds no credential of any kind: the Household is minted per test by the
  # real bootstrap script into a throwaway database that dies with the runner.
  # That is what makes the report safe to upload, and a browser failure is close
  # to undiagnosable without one.
  e2e-local:
    runs-on: ubuntu-latest
    # A `vite build` inside `webServer` plus browser startup sits outside
    # Playwright's per-test timeout.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: foerier
          POSTGRES_PASSWORD: foerier
          POSTGRES_DB: foerier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Read by `playwright.config.ts` (the API server's `DATABASE_URL`) and by
      # `test/e2e/mintInvite.ts` (the bootstrap script's). Both default to
      # :5433, which is `docker-compose.dev.yml`'s deliberate non-collision
      # port and not this runner's.
      TEST_DATABASE_URL: postgres://foerier:foerier@localhost:5432/foerier_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # No PLAYWRIGHT_BASE_URL: its absence is what selects the local project,
      # webServer block and all (`test/e2e/production.ts`).
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Whether this push contains anything that could change either image.
  # Watchtower redeploys within ~60 s of a `:latest` push, so building on a
  # prose-only commit would restart production to ship a typo fix in a design
  # doc. Everything downstream of the images hangs off this one boolean —
  # notably Tier 4, which would otherwise poll forever for a SHA that was never
  # deployed because no image was ever built.
  #
  # The test jobs above deliberately still run on every commit: they are cheap,
  # and "main is green" is worth more as a live fact than as a stale one.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.filter.outputs.deployable }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Fail *open*. Anything that cannot be worked out reliably — a new
          # branch, a force-push that orphaned the old tip — deploys. A missed
          # deploy is a silent main/production mismatch that nothing reports; a
          # redundant one costs a container restart.
          if [ -z "$BEFORE" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no usable diff base — deploying"
            echo "deployable=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "changed:"; printf '%s\n' "$changed" | sed 's/^/  /'
          # Non-deployable: docs/, .claude/, landing/, and root-level *.md
          # (README, CLAUDE). Everything else — source, Dockerfiles, the
          # lockfile, this workflow — deploys.
          #
          # `landing/` is here because it deploys, just not from this job:
          # pages.yml ships it to GitHub Pages. Without the carve-out, editing
          # a static redirect page would rebuild both images and restart
          # production to change nothing.
          if printf '%s\n' "$changed" \
            | grep -qvE '^(docs/|\.claude/|landing/|[^/]+\.md$)'; then
            echo "deployable=true" >>"$GITHUB_OUTPUT"
          else
            echo "prose only — not deploying"
            echo "deployable=false" >>"$GITHUB_OUTPUT"
          fi

  # Both images, tagged with the commit SHA and `latest`. Publishing them is
  # the whole of this repository's side of the deployment contract: what picks
  # them up, and where they run, is the infrastructure repository's business.
  #
  # No `github.event_name` guard: `changes` carries it, and a skipped `needs`
  # skips its dependents.
  build-push:
    if: needs.changes.outputs.deployable == 'true'
    needs: [changes, static-analysis, tests, server-tests, e2e-local]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: foerier-api
            dockerfile: api/Dockerfile
          - image: foerier-app
            dockerfile: app/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/branneman/${{ matrix.image }}:latest
            ghcr.io/branneman/${{ matrix.image }}:${{ github.sha }}

  # Tier 4 — the contract tier (docs/testing.md): the real deployed server, over
  # the real Caddy, at the real origin. A different claim from Tier 2s, which
  # proves the code correct against a local Postgres; this proves the *box*.
  #
  # It now also runs the household-scoped suite, which needs a Device token. It
  # mints its own — in Node, from the exported credential, with no browser —
  # because `e2e-prod` runs *after* this job and a token handed forwards would
  # have to travel as a job output or an artifact, neither of which is masked
  # and both of which are readable from the run page of a public repository. A
  # Device token never crosses a job boundary
  # (docs/specs/2026-08-28-tier-4-and-5-against-production.md §6.4).
  #
  # So this is one of the two jobs that hold the CI credential, and both obey
  # the same rules: the `push` guard on the job itself rather than only
  # inherited through `changes`, every third-party action pinned by SHA, no
  # GITHUB_TOKEN scope of any kind, the secrets on the one step that reads them,
  # and nothing — no trace, no report, no artifact — ever uploaded (§5.1, §7).
  #
  # Without the secrets — a local run — `household.test.ts` skips itself and
  # `deployment.test.ts`'s unauthenticated assertions still run.
  contract:
    needs: [changes, build-push]
    if: github.event_name == 'push' && needs.changes.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    # A hung fetch in a test's setup is outside Vitest's `testTimeout`, and this
    # job holds a production credential for as long as it runs.
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Watchtower polls GHCR on a 60 s interval, and the container then has to
      # start and run its migrations before it serves. Poll rather than sleep,
      # so a fast deploy stays fast and a stuck one fails saying what it is
      # actually serving instead of just timing out.
      - name: Wait for Watchtower to deploy this commit
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            got=$(curl -fsS --max-time 10 \
              https://api.foerier.app/api/v1/version \
              | jq -r '.sha // empty' || true)
            if [ "$got" = "$EXPECTED" ]; then
              echo "deployed $got after ${SECONDS}s"
              exit 0
            fi
            echo "serving ${got:-<unreachable>}, want $EXPECTED"
            sleep 10
          done
          echo "::error::api.foerier.app never reported $EXPECTED within 300s"
          exit 1

      # The credential secrets go on this step alone, not on the job: the
      # checkout, the toolchain and `npm ci` have no business seeing them, and
      # a step-level `env` is the difference between "one command holds the
      # key" and "every command in the job does". `E2E_USER_HANDLE` is not
      # here — Tier 4 signs in Node, where the handle is never read; only the
      # browser's virtual authenticator needs it, so only `e2e-prod` gets it.
      - run: npm run test:contract
        env:
          E2E_CREDENTIAL_ID: ${{ secrets.E2E_CREDENTIAL_ID }}
          E2E_PRIVATE_KEY: ${{ secrets.E2E_PRIVATE_KEY }}

  # Tier 5 against production (docs/testing.md). Only specs tagged @production
  # run here; everything that needs a Maintainer script, proves joining, or
  # signs the run's own Device out stays local-only (§6.2). The job holds the
  # CI credential, so: pinned actions, no GITHUB_TOKEN scope, and nothing — no
  # trace, no report, no artifact — is ever uploaded from it. The production
  # Playwright project sets `trace: 'off'` and the `list` reporter, so there is
  # nothing to upload even if a step were added.
  #
  # `needs: contract` is not decoration: that job already polls /version until
  # the pushed SHA is served, so the deploy-wait is written once and Tier 5
  # inherits it. The `push` guard is repeated on this job rather than only
  # inherited through `changes`, because a job holding a production credential
  # should not lean on a guard that exists to skip prose-only deploys (§7).
  #
  # `vars.E2E_ENABLED` is the flip that turns this job on, and it stays off
  # until the one-time credential capture (§5) has happened. The capture needs
  # an API already serving this branch's ES256 algorithm ordering, so the
  # secrets cannot exist before this merges — and unlike Tier 4, Tier 5 cannot
  # degrade without them: `globalSetup.production.ts` throws on an empty
  # `E2E_*`. The repository variable is therefore what keeps `main` green in
  # the window between merge and capture; flip it to `true` afterwards.
  e2e-prod:
    needs: [changes, contract]
    if: vars.E2E_ENABLED == 'true' && github.event_name == 'push' && needs.changes.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    # A hung fetch in `globalSetup` is outside Playwright's per-test timeout,
    # and this job holds a production credential for as long as it runs.
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: https://app.foerier.app
          E2E_CREDENTIAL_ID: ${{ secrets.E2E_CREDENTIAL_ID }}
          E2E_PRIVATE_KEY: ${{ secrets.E2E_PRIVATE_KEY }}
          E2E_USER_HANDLE: ${{ secrets.E2E_USER_HANDLE }}
